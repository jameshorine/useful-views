# Great Docs configuration for useful-views.
# Build the site with:   uv run --group docs great-docs build
# Preview it with:       uv run --group docs great-docs preview
# Pages in user_guide/reference/cli.md, rules.md and check-findings.md are generated:
#   uv run python scripts/generate_docs.py
# See https://posit-dev.github.io/great-docs/ for every option.

display_name: useful-views

# The navbar shows the binoculars next to the text title, and the same icon
# is the browser-tab icon. On the landing page, the hero banner shows the
# wide logo in the site's light or dark theme, and replaces the README's
# centered logo-and-badges block (great-docs strips that block).
logo:
  light: docs/useful-views-icon.svg
  dark: docs/useful-views-icon.svg
  show_title: true
favicon: docs/useful-views-icon.svg

# Custom CSS (code blocks scroll instead of spilling; see the file).
site:
  css: docs/assets/site.css
hero:
  enabled: true
  logo:
    light: docs/useful-views-logo.svg
    dark: docs/useful-views-logo-dark.svg
  logo_height: 140px
  name: false          # the logo already says "useful-views"
parser: google
dynamic: true
# Run the code in .qmd pages on every build, so the output they show is what
# the current code prints.
freeze: false
repo: https://github.com/jameshorine/useful-views
site_url: https://jameshorine.github.io/useful-views/

# The user guide is the pages in user_guide/, in this order (like the nav:
# list in an mkdocs.yml). Pages that show output are .qmd: Quarto runs their
# code when the site is built. A new page must be added here to be linked;
# tests/test_docs.py checks that every page is listed. docs/STYLE.md says
# how the pages are written and which page is home to each topic. Images
# and CSS stay in docs/.
user_guide:
  - section: Get started
    contents:
      - quickstart.qmd
      - installation.md
  - section: Projects and recipes
    contents:
      - concepts/projects.md
      - concepts/recipes.md
      - concepts/steps.md
      - concepts/sources.md
  - section: Keeping views current
    contents:
      - concepts/running.qmd
      - concepts/stale-views.md
      - guides/fingerprints.qmd
  - section: Records
    contents:
      - concepts/records.md
      - concepts/cookbook.md
  - section: Working with others
    contents:
      - guides/python.qmd
      - guides/ai-tools.md
      - guides/compare.md
  - section: Reference
    contents:
      - reference/cli.md
      - reference/rules.md
      - reference/check-findings.md
      - reference/environment.md
      - reference/data-hash.md

# The API reference. With no `title`, the navbar still says "Reference". Each
# entry's line in the index is the first line of its docstring.
reference:
  desc: Examples assume `import useful_views as uvs`, and run in the pwt example after `useful-views sync`.
  sections:
    - title: Projects
      desc: Make a project, or get the example.
      contents:
        - init
        - example
        - root
    - title: Recipes
      desc: Start a recipe, then make its views.
      contents:
        - new_recipe
        - run
        - sync
    - title: Checking
      desc: Find problems, and write the cookbook.
      contents:
        - check
        - cookbook
    - title: Fingerprints
      desc: The data hash of a parquet file.
      contents:
        - data_hash
    - title: Results
      desc: What run, sync and cookbook return, and what check finds.
      contents:
        - RunResult
        - SyncResult
        - Finding
        - CookbookResult
    - title: Errors and warnings
      desc: Every error is a UsefulViewsError, with its facts as attributes and in to_dict().
      contents:
        - UsefulViewsError
        - RecipeRefused
        - StepFailed
        - OutputError
        - ProjectError
        - ProjectNotFound
        - ExampleError
        - CookbookError
        - DataHashError
        - UsefulViewsWarning
    - title: Rules
      desc: The numbered rules a recipe must follow.
      contents:
        - RULES
        - Rule

skill:
  enabled: true
  # Written by hand, so it can say how to drive the command line, not only the
  # Python API. Keep it in step with user_guide/guides/ai-tools.md.
  file: skills/useful-views/SKILL.md
