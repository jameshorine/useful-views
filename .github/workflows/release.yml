name: Release

# Publishes a release to PyPI when a version tag is pushed:
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Tag the merge commit on main once CI is green there, and push only the
# tag: a release created by hand in GitHub would make the last job fail.
#
# Before the first release, PyPI must trust this workflow: on pypi.org,
# Your projects > Publishing > Add a new pending publisher, with owner
# jameshorine, repository useful-views, workflow release.yml and
# environment pypi. No password or API token is stored anywhere.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false  # never build a release from a cache other runs filled
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          # Checked before the upload, which cannot be undone: the release notes
          # come from this CHANGELOG section, and the citation must match.
          grep -q "^## $version (" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version (date)' section"; exit 1; }
          grep -q "^version: $version$" CITATION.cff || { echo "CITATION.cff is not version $version"; exit 1; }
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/useful-views/
    permissions:
      id-token: write  # Trusted Publishing: PyPI checks who is publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the release, with this version's CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "useful-views $version" --notes-file notes.md
