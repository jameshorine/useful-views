name: CI Docs

# Builds on every pull request (as a check, without publishing), and builds
# and publishes to GitHub Pages on every push to main. Also runs by hand
# (Actions tab > CI Docs > Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and dependencies
        run: |
          python -m pip install uv
          uv sync --locked --group docs

      - name: Check the generated reference pages are up to date
        run: |
          uv run python scripts/generate_docs.py
          git diff --exit-code user_guide/reference

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs
        run: uv run --group docs great-docs build

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        run: uv run --group docs great-docs ci notice --run ${{ github.run_id }} --pr ${{ github.event.number }}

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    # One deployment at a time; a newer one waits instead of cancelling.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: "Preview Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      # Post (and keep updated) a sticky PR comment with the local-preview
      # command, pinned to this run so it reproduces the build under review.
      # Runs the released great-docs via pipx (no install step needed); kept as
      # its own minimal job so the docs build never holds a pull-requests:write
      # token. continue-on-error so fork PRs (read-only token) don't fail the run.
      - name: Post preview instructions to the PR
        continue-on-error: true
        run: pipx run great-docs ci pr-comment --run ${{ github.run_id }} --pr ${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
