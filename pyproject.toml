[project]
name = "useful-views"
version = "0.1.0"
description = "A framework and data project structure in which every derived table records the recipe that made it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Horine" }]
requires-python = ">=3.11"
dependencies = ["pyarrow>=16"]
keywords = ["data", "research", "reproducibility", "data-package", "parquet", "pipelines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/jameshorine/useful-views"
Documentation = "https://jameshorine.github.io/useful-views/"
Issues = "https://github.com/jameshorine/useful-views/issues"

[project.scripts]
useful-views = "useful_views.cli:main"

[dependency-groups]
bench = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "polars>=1.20",
    "frictionless[pandas]>=5.18,<6",
]
docs = [
    "great-docs>=0.17,<0.18",
]

[build-system]
requires = ["hatchling>=1.27,<1.30"]  # 1.30+ writes Metadata-Version 2.5, not yet accepted everywhere
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/useful_views"]

[tool.pytest.ini_options]
testpaths = ["tests"]
