[project]
name = "useful-views"
version = "0.1.0"
description = "A framework and data project structure in which every derived table records the recipe that made it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=14"]

[project.scripts]
useful-views = "useful_views.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "polars>=1.20",
    "frictionless[pandas]>=5.18,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/useful_views"]

[tool.pytest.ini_options]
testpaths = ["tests"]
